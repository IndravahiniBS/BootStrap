<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <button class="btn">Click me</button>
    <!-- btn is a Bootstrap class that styles the button with default Bootstrap button styles, including padding, border, and background color. You can also use additional classes like btn-primary, btn-secondary, btn-success, btn-danger, btn-warning, btn-info, and btn-dark to apply different colors and styles to the button. For example, <button class="btn btn-primary">Click me</button> would create a button with the primary color styling. -->

    <!-- buttons can automatically adjust their text color and size based on the content inside them. If you want to create buttons of different sizes, you can use additional Bootstrap classes like btn-lg for large buttons and btn-sm for small buttons. For example, <button class="btn btn-primary btn-lg">Large Button</button> would create a large button with primary color styling, while <button class="btn btn-secondary btn-sm">Small Button</button> would create a small button with secondary color styling. These classes help you easily customize the size of your buttons to fit your design needs.  -->

    <button class="btn btn-primary">Click me</button> 
    <button class="btn btn-secondary">Click me</button>
    <button class="btn btn-success">Click me</button>

    <button class="btn btn-secondary btn-lg">Large Button</button>

    <button class="btn btn-secondary btn-sm">Small Button</button>

    <button class="btn btn-outline-success">Outlined Success Button</button>
    <!-- btn-outline is a Bootstrap class that creates an outlined button style. Instead of a solid background color, the button will have a transparent background with a colored border and text. For example, <button class="btn btn-outline-success">Outlined Success Button</button> would create a button with a green border and text, but no background color. This style is often used for secondary actions or when you want to create a more subtle button appearance. You can use this class with any of the color variants like btn-outline-primary, btn-outline-secondary, btn-outline-danger, etc., to achieve different outlined button styles. -->

    <a href="#" class="btn btn-primary">Link Button</a>

    <!-- In bootstrap, you can also use the btn class with anchor tags (<a>) to create link buttons. This allows you to style links as buttons while still maintaining their functionality as hyperlinks. For example, <a href="#" class="btn btn-primary">Link Button</a> would create a link that looks like a primary button. This is useful for navigation or when you want to provide a call-to-action that leads to another page or section of your website. You can apply the same button classes to anchor tags as you would with regular buttons to achieve the desired styling. -->

    <br><br>

    <div class="btn-group">
        <button class="btn btn-primary">Home</button>
        <button class="btn btn-success">Login</button>
        <button class="btn btn-danger">Logout</button>    
    </div>

    <!-- btn-group is a Bootstrap class that allows you to group multiple buttons together on a single line. When you wrap buttons inside a div with the class btn-group, it will display the buttons next to each other without any spacing between them, creating a cohesive button group. This is useful for organizing related actions or options in a compact and visually appealing way. For example, in the code above, we have three buttons (Home, Login, Logout) grouped together using the btn-group class, which makes them appear as a unified set of actions. You can also use additional classes like btn-group-lg or btn-group-sm to adjust the size of the button group as needed. -->

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
