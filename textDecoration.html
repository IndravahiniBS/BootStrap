<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <p class="text-decoration-underline">This text is underlined.</p>
    <p class="text-decoration-line-through">This text is struck through.</p>
    <p class="text-center">This text is centered.</p>
    <p class="text-end">This text is right-aligned.</p>
    <p class="fw-bold">This text is bold.</p>
    <p>This uses <mark>Mark</mark></p>
    <!-- Mark is a Bootstrap class that highlights text with a yellow background, making it stand out from the surrounding content. You can use it to draw attention to specific words or phrases in your web page. Simply wrap the text you want to highlight with the <mark> tag, and it will be styled accordingly. This is particularly useful for emphasizing important information or key points in your content. -->

    <p>This uses <del>Deleted</del></p>
    <!-- del is a Bootstrap class that applies a strikethrough effect to text, indicating that it has been deleted or is no longer relevant. You can use it to show changes or updates in your content. Simply wrap the text you want to mark as deleted with the <del> tag, and it will be styled with a line through it. This is often used in conjunction with other classes to provide additional context or styling to the deleted text. -->
    <p>This uses <u>Underlined</u></p>
    <!-- u is a Bootstrap class that applies an underline to text, making it stand out and indicating that it is important or should be emphasized. You can use it to highlight specific words or phrases in your web page. Simply wrap the text you want to underline with the <u> tag, and it will be styled accordingly. This is particularly useful for drawing attention to key information or important points in your content. -->

    <!-- There are also tags for text transformation, such as: em,strong etc -->
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html
