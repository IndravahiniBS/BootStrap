            <div class="card-body">
                <div class="card-title">

                <!-- card-title is a Bootstrap class that is used to style the title of a card component. It is typically applied to a heading element (such as <h5> or <h3>) within the card to give it a distinct appearance and make it stand out as the main title of the card. The "card-title" class provides consistent styling for the title, including font size, weight, and spacing, making it visually appealing and easy to read. In this example, we have used the "card-title" class to style the text "Card Title", which serves as the main heading for our card. You can customize the appearance of the card title further by applying additional CSS styles or using different heading levels as needed. -->

                Card Title
                </div>
            <div class="card-text">
                <!-- card-text is a Bootstrap class that is used to style the main content or body text of a card component. It is typically applied to a paragraph element (<p>) within the card to give it a consistent appearance and ensure that it is visually appealing and easy to read. The "card-text" class provides styling for the text, including font size, line height, and spacing, making it an essential part of the card's layout. In this example, we have used the "card-text" class to style the text "Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptas, voluptate.", which serves as the main content of our card. You can customize the appearance of the card text further by applying additional CSS styles or using different HTML elements as needed. -->
