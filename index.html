<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Hello World</h1>
    <h2>Trying Bootstrap...</h2>
    <span class="h1">This is a span</span>
    <!-- here h1 is a bootstrap class that makes the span look like an h1 element. You can use any bootstrap class to style your elements. For example, you can use the "text-primary" class to make the text blue, or the "bg-secondary" class to give it a gray background. Bootstrap provides a wide range of classes for typography, colors, spacing, and more, allowing you to easily customize the appearance of your web page. -->
     <h1 class="h2">This is an h1 with h2 styling</h1>
     <p class="display-1">This is a paragraph with display-1 styling</p>
     <!-- display-1 is a bootstrap class that makes the text larger and bolder, often used for headings or important text. You can use it to create a strong visual impact on your web page. Bootstrap also offers other display classes like display-2, display-3, and display-4,(upto 6) each providing different levels of emphasis and size for your text. -->
      <p class="lead">This is a lead paragraph.</p>
      <!-- lead is a bootstrap class that makes the text larger and more prominent, often used for introductory or important content. It helps to draw attention to the text and can be used to highlight key information on your web page. You can use it in combination with other classes to further customize the appearance of your content. -->
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
